# Hyperparameter search spaces and HPO protocol.
# Protocol: every trial is scored with k-fold CV *inside the training split*;
# the held-out test split is only touched once, for the final tuned-vs-default
# comparison, so the reported score is not selection-biased.
seed: 42
n_trials: 25
cv_folds: 3
quick:
  n_trials: 4
  hpo_models: [hgb]
  dataset: breast_cancer
pruner:
  n_startup_trials: 5
  n_warmup_steps: 1
  interval_steps: 1
study_models: [hgb, rf, mlp]
spaces:
  hgb:
    learning_rate: {type: float, low: 0.03, high: 0.3, log: true}
    max_leaf_nodes: {type: int, low: 7, high: 63}
    max_iter: {type: int, low: 50, high: 300}
    min_samples_leaf: {type: int, low: 1, high: 20}
    l2_regularization: {type: float, low: 1.0e-8, high: 1.0, log: true}
  rf:
    n_estimators: {type: int, low: 50, high: 300}
    max_depth: {type: int, low: 3, high: 20}
    min_samples_leaf: {type: int, low: 1, high: 10}
    max_features: {type: categorical, choices: [sqrt, log2, 0.5]}
  mlp:
    hidden_dim: {type: int, low: 16, high: 128}
    n_layers: {type: int, low: 1, high: 3}
    lr: {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
    dropout: {type: float, low: 0.0, high: 0.6}
    weight_decay: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
    epochs: {type: int, low: 20, high: 120}
