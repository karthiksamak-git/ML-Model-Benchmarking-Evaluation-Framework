name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Quick benchmark pipeline (< 3 min)
        run: |
          mlbe benchmark --quick
          mlbe hpo --quick
          mlbe analyze --quick
          mlbe rubric --quick
          mlbe repro --sample --demo-failure
          mlbe export
          mlbe figures
      - name: Verify exported artifacts
        run: |
          python - <<'PY'
          import json, pathlib
          data = pathlib.Path("web/public/data")
          required = ["leaderboard.json", "runs.json", "stats.json", "pareto.json", "hpo.json",
                      "error_analysis.json", "rubric_dataset.json", "rubric_model.json",
                      "rubric_validation.json", "env.json"]
          for name in required:
              payload = json.loads((data / name).read_text())
              assert payload.get("provenance", {}).get("git_hash"), name
          print("exported artifacts validated:", len(required))
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:golden
      - run: npm run build
